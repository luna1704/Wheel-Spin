    .logo-title {
      margin-top: 30px;
      font-size: 3rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 2px 2px 4px #000;
      text-align: center;
    }

    .subtitle {
      font-size: 1.3rem;
      color: #f0f0f0;
      text-shadow: 1px 1px 2px #000;
      text-align: center;
      margin-top: 5px;
    }

    .game-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }

    canvas {
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      animation: idleSpin 10s linear infinite;
    }

    @keyframes idleSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    #spinBtn {
      margin-top: 30px;
      padding: 14px 30px;
      background: #b71c1c;
      color: white;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-family: 'Times New Roman', serif;
    }

    .wheel-container {
      position: relative;
      display: inline-block;
    }

    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%) rotate(180deg);
      width: 0;
      height: 0;
      border-left: 25px solid transparent;
      border-right: 25px solid transparent;
      border-bottom: 40px solid #fff;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="logo-title">🎉 Vòng Quay May Mắn 🎉</div>
  <p class="subtitle">Bạn đã đạt đủ mức chi tiêu để tham gia vòng quay! Nhấn nút bên dưới để thử vận may nhé!</p>

  <div class="game-section">
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel" width="600" height="600"></canvas>
    </div>
    <button id="spinBtn">QUAY</button>
  </div>

  <script>
    const prizes = [
      "🎉 GIẢI ĐẶC BIỆT 🎉",
      "Khai vị miễn phí",
      "Quà bí ẩn",
      "Thức uống miễn phí",
      "Tráng miệng miễn phí",
      "Giảm giá 10% toàn hóa đơn"
    ];

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const radius = canvas.width / 2;
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    function drawWheel() {
      const angle = (2 * Math.PI) / prizes.length;
      for (let i = 0; i < prizes.length; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#e53935' : '#c62828';
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle * i, angle * (i + 1));
        ctx.closePath();
        ctx.fill();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle * (i + 0.5));
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 18px 'Times New Roman', serif";
        ctx.fillText(prizes[i], radius - 30, 10);
        ctx.restore();
      }
    }

    drawWheel();

    document.getElementById("spinBtn").addEventListener("click", () => {
      canvas.style.animation = "none"; // Stop idle spin
      void canvas.offsetWidth; // force reflow to allow new transform
      const totalSegments = prizes.length;
      const prizeIndex = 0.5;
      const segmentAngle = 360 / totalSegments;
      const offsetToTop = 270;
      const rotationAngle = (totalSegments - prizeIndex) * segmentAngle;
      const fullRotations = 5 * 360;
      const finalAngle = fullRotations + rotationAngle + offsetToTop;

      canvas.style.transition = "transform 4s ease-out";
      canvas.style.transform = 'rotate(' + finalAngle + 'deg)';

      setTimeout(() => {
        alert("🎉 GIẢI ĐẶC BIỆT! Xin vui lòng chờ nhân viên mang phần quà ra...");
      }, 4500);
    });
  </script>
</body>
</html>
